# One command to run the whole thing: `docker compose up --build`.
# Postgres comes up first; hookrelay waits for its healthcheck, runs migrations
# on boot, then serves the API on localhost:8080 and starts the worker pool.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
      POSTGRES_DB: hookrelay
    # Not published to the host: the service reaches Postgres over the compose
    # network. Uncomment to poke at the DB directly with psql.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  hookrelay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hookrelay:hookrelay@postgres:5432/hookrelay?sslmode=disable
      HTTP_ADDR: ":8080"
      WORKERS: "4"
      MAX_ATTEMPTS: "5"
      BACKOFF_BASE: "10s"
      BACKOFF_FACTOR: "4"
      BACKOFF_CAP: "1h"
    ports:
      - "8080:8080"

volumes:
  pgdata:
